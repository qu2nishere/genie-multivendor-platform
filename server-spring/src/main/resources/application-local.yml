# Máy dev — hạ tầng chạy bằng deploy/docker-compose.local.yml (postgres, redis, minio, mailpit)
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/genie}
    username: ${DB_USER:genie}
    password: ${DB_PASSWORD:changeme}
  flyway:
    # R__seed_demo.sql chỉ chạy ở profile local / demo
    locations: classpath:db/migration
  data:
    redis:
      password: ${REDIS_PASSWORD:changeme}
  mail:
    host: localhost
    port: 1025                    # Mailpit — xem email ở http://localhost:8025

management:
  endpoint:
    health:
      show-details: always

genie:
  security:
    jwt-secret: ${JWT_SECRET:local-dev-secret-change-me-local-dev-secret-change-me}
    internal-token: ${INTERNAL_TOKEN:local-internal-token}
    kyc-aes-key: ${KYC_AES_KEY:local-kyc-key}
    wallet-hmac-secret: ${WALLET_HMAC_SECRET:local-wallet-secret}
  storage:
    access-key: ${MINIO_APP_ACCESS_KEY:genie-app}
    secret-key: ${MINIO_APP_SECRET_KEY:changeme}

logging:
  level:
    com.genie: DEBUG
