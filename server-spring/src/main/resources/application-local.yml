# Profile local — máy dev. File này CHỈ chứa giá trị dự phòng ${BIEN:mặc_định} khớp deploy/docker-compose.local.yml
# (postgres, redis, silo, mailpit) để clone về là chạy được không cần .env.
# Muốn đổi (PostgreSQL cài trên máy, đổi cổng, Gmail thật…): ghi biến vào .env ở gốc repo (mẫu: .env.example) — KHÔNG sửa file này
# và KHÔNG ghi mật khẩu thật vào đây (file này có trên git).
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/genie}
    username: ${DB_USER:genie}
    password: ${DB_PASSWORD:changeme}
  flyway:
    placeholders:
      seed_demo: ${GENIE_SEED_DEMO:true}       # không muốn nạp dữ liệu mẫu → GENIE_SEED_DEMO=false trong .env
  data:
    redis:
      password: ${REDIS_PASSWORD:changeme}
  # mail: dùng cấu hình chung — mặc định Mailpit localhost:1025 (xem OTP ở http://localhost:8025);
  # muốn gửi Gmail thật thì đặt SMTP_* + MAIL_FROM trong .env

management:
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:always}

logging:
  level:
    com.genie: ${LOG_LEVEL_GENIE:DEBUG}

genie:
  ai-worker:
    mode: ${AI_WORKER_MODE:stub}                  # máy dev: giả lập AI Worker (ADR 0011 mục 6); chạy cùng AI Worker thật → AI_WORKER_MODE=http
  security:
    jwt-secret: ${JWT_SECRET:local-dev-secret-change-me-local-dev-secret-change-me}
    internal-token: ${INTERNAL_TOKEN:local-internal-token}
    kyc-aes-key: ${KYC_AES_KEY:Z2VuaWUtbG9jYWwtZGV2LWt5Yy1rZXktMzItYnl0ZXM=}   # base64 32 byte (AES-256) — chỉ dùng máy dev
    wallet-hmac-secret: ${WALLET_HMAC_SECRET:local-wallet-secret}
    otp-pepper: ${OTP_PEPPER:local-otp-pepper}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}   # http://localhost — trình duyệt bỏ cookie Secure trên http
    cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4321}
  storage:
    access-key: ${MINIO_APP_ACCESS_KEY:genie-app}
    secret-key: ${MINIO_APP_SECRET_KEY:changeme}
