# Cấu hình chung mọi môi trường (TECH_STACK mục 16.6).
# Quy ước: giá trị thay đổi theo môi trường (địa chỉ, tài khoản, khóa bí mật, kích thước pool, mức log…) LUÔN đọc từ
# biến môi trường ${TEN_BIEN}. Máy dev đặt biến trong tệp .env ở gốc repo (mẫu: .env.example), VPS trong deploy/.env.
# - Bí mật (DB_PASSWORD, JWT_SECRET, …) KHÔNG có mặc định ở đây → thiếu biến thì backend dừng ngay (an toàn cho prod).
#   Giá trị dự phòng cho máy dev nằm ở application-local.yml.
# - Hằng số nghiệp vụ theo tài liệu (TTL token, TTL Presigned URL…) giữ trong file này vì không đổi theo môi trường.
spring:
  application:
    name: genie-backend
  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS_ENABLED:false}   # chưa bật mặc định (mục 3.1)
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}       # DB cloud gói miễn phí: hạ xuống 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # mọi môi trường — schema chỉ do Flyway tạo
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    placeholders:
      bootstrap_admin_email: ${BOOTSTRAP_ADMIN_EMAIL:admin@genie.local}
      bootstrap_admin_password_hash: ${BOOTSTRAP_ADMIN_PASSWORD_HASH:}
      seed_demo: ${GENIE_SEED_DEMO:false}      # R__seed_demo.sql chỉ chạy khi true (mặc định true ở profile local)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 10000   # TS 10.2: SMTP timeout 10 s
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  servlet:
    multipart:
      enabled: false              # không upload qua Spring — Presigned URL lên Silo

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:when-authorized}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.genie: ${LOG_LEVEL_GENIE:INFO}

genie:
  version: ${GENIE_VERSION:0.0.1-SNAPSHOT}
  web-url: ${PUBLIC_WEB_URL:http://localhost:4321}
  mail-from: ${MAIL_FROM:no-reply@genie.local}   # gửi qua Gmail: MAIL_FROM phải trùng SMTP_USER
  scheduling:
    enabled: ${GENIE_SCHEDULING_ENABLED:true}    # false = tắt mọi cron (vd. máy dev trỏ chung DB cloud với người khác)
  security:
    jwt-secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    cors-origins: ${CORS_ALLOWED_ORIGINS:${PUBLIC_WEB_URL:http://localhost:4321}}
    otp-pepper: ${OTP_PEPPER}
    internal-token: ${INTERNAL_TOKEN}
    kyc-aes-key: ${KYC_AES_KEY}
    wallet-hmac-secret: ${WALLET_HMAC_SECRET}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-url: ${PUBLIC_S3_URL:http://localhost:9000}
    access-key: ${MINIO_APP_ACCESS_KEY}
    secret-key: ${MINIO_APP_SECRET_KEY}
    presigned-put-ttl: 15m
    presigned-put-kyc-ttl: 10m
    presigned-get-ttl: 5m
    region: ${STORAGE_REGION:us-east-1}            # Silo bỏ qua; AWS S3 phải đúng vùng của bucket
    bucket-prefix: ${STORAGE_BUCKET_PREFIX:}       # tên bucket thật = tiền tố + tên logic (AWS: tên bucket duy nhất toàn cầu)
  ai-worker:
    url: ${AI_WORKER_URL:http://localhost:8000}
  payment:
    vnpay:
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      url: ${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      return-url: ${VNPAY_RETURN_URL:http://localhost:4321/checkout/result}
    sepay:
      api-key: ${SEPAY_API_KEY:}
      account-number: ${SEPAY_ACCOUNT_NUMBER:}
  shipping:
    ghn:
      token: ${GHN_TOKEN:}
      shop-id: ${GHN_SHOP_ID:}
    ghtk-token: ${GHTK_TOKEN:}
    vtp-token: ${VTP_TOKEN:}
    jt-key: ${JT_KEY:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
