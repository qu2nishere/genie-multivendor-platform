# Cấu hình mặc định chung — giá trị bí mật lấy từ biến môi trường (TECH_STACK mục 16.6)
spring:
  application:
    name: genie-backend
  threads:
    virtual:
      enabled: false            # chưa bật mặc định (mục 3.1)
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # mọi môi trường — schema chỉ do Flyway tạo
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      bootstrap_admin_email: ${BOOTSTRAP_ADMIN_EMAIL:admin@genie.local}
      bootstrap_admin_password_hash: ${BOOTSTRAP_ADMIN_PASSWORD_HASH:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
  servlet:
    multipart:
      enabled: false              # không upload qua Spring — Presigned URL MinIO

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: 1.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

genie:
  version: ${GENIE_VERSION:0.0.1-SNAPSHOT}
  web-url: ${PUBLIC_WEB_URL:http://localhost:4321}
  security:
    jwt-secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    internal-token: ${INTERNAL_TOKEN}
    kyc-aes-key: ${KYC_AES_KEY}
    wallet-hmac-secret: ${WALLET_HMAC_SECRET}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-url: ${PUBLIC_S3_URL:http://localhost:9000}
    access-key: ${MINIO_APP_ACCESS_KEY}
    secret-key: ${MINIO_APP_SECRET_KEY}
    presigned-put-ttl: 15m
    presigned-put-kyc-ttl: 10m
    presigned-get-ttl: 5m
  ai-worker:
    url: ${AI_WORKER_URL:http://localhost:8000}
  payment:
    vnpay:
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      url: ${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      return-url: ${VNPAY_RETURN_URL:http://localhost:4321/checkout/result}
    sepay:
      api-key: ${SEPAY_API_KEY:}
      account-number: ${SEPAY_ACCOUNT_NUMBER:}
  shipping:
    ghn:
      token: ${GHN_TOKEN:}
      shop-id: ${GHN_SHOP_ID:}
    ghtk-token: ${GHTK_TOKEN:}
    vtp-token: ${VTP_TOKEN:}
    jt-key: ${JT_KEY:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
  mail-from: ${MAIL_FROM:no-reply@genie.local}
