# Profile prod — production: AWS RDS (PostgreSQL) + AWS S3 (ADR 0010); app chạy bằng deploy/docker-compose.yml.
# Mọi giá trị đọc từ deploy/.env (mẫu: deploy/.env.example). Bí mật và địa chỉ AWS KHÔNG có mặc định (thiếu → dừng).
spring:
  datasource:
    # DB_URL = jdbc:postgresql://<id>.<mã>.<vùng>.rds.amazonaws.com:5432/genie?sslmode=require  (base: application.yml)
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}     # RDS db.t4g.micro ~80 kết nối tối đa — chừa chỗ cho psql / sao lưu
  data:
    redis:
      host: ${REDIS_HOST:redis}                 # Redis vẫn là container trong mạng Compose
  mail:
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}

genie:
  storage:
    endpoint: ${MINIO_ENDPOINT}                    # https://s3.<vùng>.amazonaws.com — tên biến MINIO_* giữ nguyên (ADR 0009, 0010)
    public-url: ${PUBLIC_S3_URL:${MINIO_ENDPOINT}} # AWS: để giống MINIO_ENDPOINT → URL ảnh dạng https://<bucket>.s3.<vùng>.amazonaws.com/…
    region: ${STORAGE_REGION:ap-southeast-1}
    bucket-prefix: ${STORAGE_BUCKET_PREFIX}        # bắt buộc, vd. genie-prod- (khớp deploy/aws/s3-init.sh)
  ai-worker:
    url: ${AI_WORKER_URL:http://ai-worker:8000}
    mode: ${AI_WORKER_MODE:http}
    callback-base-url: ${BACKEND_INTERNAL_URL:http://backend:8080}
