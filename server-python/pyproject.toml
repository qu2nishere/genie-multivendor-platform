[project]
name = "genie-ai-worker"
version = "0.0.1"
description = "AI Worker Genie — KYC (ONNX + OpenCV) và phân tích cảm xúc đánh giá PhoBERT (ONNX)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "minio>=7.2",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "onnxruntime>=1.19",
    "transformers>=4.45",       # tokenizer PhoBERT
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
