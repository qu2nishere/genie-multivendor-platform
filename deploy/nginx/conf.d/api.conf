# api.genie.vn → backend:8080 — REST /api/v1, WebSocket /ws, webhook VNPay / SePay / 3PL
server {
    listen 443 ssl;
    http2 on;
    server_name api.genie.vn;

    ssl_certificate     /etc/letsencrypt/live/genie.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/genie.vn/privkey.pem;

    client_max_body_size 1m;   # API không nhận tệp — upload qua Presigned URL

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Actuator chỉ cho mạng nội bộ
    location /actuator { return 404; }
    location / { return 404; }
}
