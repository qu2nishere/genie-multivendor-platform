# genie.vn (+ www) → frontend:4321 — Storefront, /seller/*, /admin/*
server {
    listen 443 ssl;
    http2 on;
    server_name genie.vn www.genie.vn;

    ssl_certificate     /etc/letsencrypt/live/genie.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/genie.vn/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://s3.genie.vn https://qr.sepay.vn; connect-src 'self' https://api.genie.vn wss://api.genie.vn https://s3.genie.vn; form-action 'self' https://sandbox.vnpayment.vn https://pay.vnpay.vn; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;

    location /_astro/ {
        proxy_pass http://frontend:4321;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://frontend:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
