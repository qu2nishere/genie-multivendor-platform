# s3.genie.vn → minio:9000 — đọc ảnh công khai + Presigned PUT / GET từ trình duyệt
server {
    listen 443 ssl;
    http2 on;
    server_name s3.genie.vn;

    ssl_certificate     /etc/letsencrypt/live/genie.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/genie.vn/privkey.pem;

    client_max_body_size 35m;   # video ≤ 30 MB
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_pass http://minio:9000;
        proxy_set_header Host $http_host;   # GIỮ NGUYÊN Host — chữ ký Presigned URL phụ thuộc host
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Cache ảnh công khai 7 ngày
    location ~ ^/(product-media|avatar-assets|review-media|content-assets)/ {
        proxy_pass http://minio:9000;
        proxy_set_header Host $http_host;
        add_header Cache-Control "public, max-age=604800";
    }
}
