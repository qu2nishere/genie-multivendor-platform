# Tham số cho ~2 GB RAM — TECH_STACK mục 16.2
listen_addresses = '*'
max_connections = 50
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 128MB
wal_buffers = 16MB
checkpoint_completion_target = 0.9
random_page_cost = 1.1
default_statistics_target = 100
timezone = 'UTC'
log_timezone = 'UTC'
log_min_duration_statement = 500   # ghi truy vấn chậm > 500 ms
