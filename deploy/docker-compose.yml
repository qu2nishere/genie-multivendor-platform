# Production trên VPS / EC2 — TECH_STACK mục 16, ADR 0010
# CSDL = AWS RDS (PostgreSQL 16), kho tệp = AWS S3 — KHÔNG chạy container postgres / silo ở đây.
# Trước lần đầu: tạo RDS + bucket S3 + IAM theo deploy/aws/README.md, điền deploy/.env.
# Chạy: export TAG=vX.Y.Z && docker compose pull && docker compose up -d   (deploy/scripts/deploy.sh)
# Chỉ nginx mở cổng 80/443; redis, ai-worker chỉ trong mạng nội bộ.

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  nginx:
    <<: *common
    image: nginx:1.27-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on: [frontend, backend]
    deploy: { resources: { limits: { memory: 64m } } }
    healthcheck: { test: ["CMD", "nginx", "-t"], interval: 60s }

  frontend:
    <<: *common
    image: ghcr.io/${GHCR_OWNER:-genie}/genie-frontend:${TAG}
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      PUBLIC_S3_URL: ${PUBLIC_S3_URL}
      INTERNAL_API_URL: http://backend:8080
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL}
    depends_on: [backend]
    deploy: { resources: { limits: { memory: 384m } } }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:4321/"], interval: 30s }

  backend:
    <<: *common
    image: ghcr.io/${GHCR_OWNER:-genie}/genie-backend:${TAG}
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: -Xms512m -Xmx1536m
      GENIE_VERSION: ${TAG}
      REDIS_HOST: redis
      AI_WORKER_URL: http://ai-worker:8000
      # DB_URL (RDS), MINIO_ENDPOINT (S3), STORAGE_REGION, STORAGE_BUCKET_PREFIX… lấy từ .env
    depends_on:
      redis: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 2g } } }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      start_period: 90s

  ai-worker:
    <<: *common
    image: ghcr.io/${GHCR_OWNER:-genie}/genie-ai-worker:${TAG}
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      BACKEND_URL: http://backend:8080
      # AI Worker dùng host S3 không có https:// (thư viện minio Python) + bật TLS
      MINIO_ENDPOINT: s3.${STORAGE_REGION:-ap-southeast-1}.amazonaws.com
      MINIO_SECURE: "true"
      MINIO_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_APP_SECRET_KEY}
      STORAGE_BUCKET_PREFIX: ${STORAGE_BUCKET_PREFIX}
      STORAGE_REGION: ${STORAGE_REGION:-ap-southeast-1}
    volumes: [models:/app/models]
    deploy: { resources: { limits: { memory: 2g } } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      start_period: 120s

  redis:
    <<: *common
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    deploy: { resources: { limits: { memory: 320m } } }
    healthcheck: { test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"], interval: 10s }

volumes:
  redisdata:
  models:
  certbot-www:
