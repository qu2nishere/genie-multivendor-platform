# Máy dev: postgres, redis, silo (kho tệp S3) + silo-init, mailpit — backend / web / ai-worker chạy từ IDE (TECH_STACK mục 16.1)
# Chạy (từ gốc repo, dùng CHUNG tệp .env với backend):
#   docker compose --env-file .env -f deploy/docker-compose.local.yml up -d
# Cổng trên máy dev đọc từ biến, mặc định như cũ. Cổng bị chiếm (vd. đã cài PostgreSQL thật) → đặt biến trong .env,
# rồi sửa biến của backend cho cùng cổng — bảng ở docs/cau-hinh-moi-truong.md mục 4 (Đổi cổng khi bị chiếm):
#   POSTGRES_PORT      (5432) → DB_URL=jdbc:postgresql://localhost:<cổng>/genie
#   REDIS_PORT         (6379) → backend dùng chung biến này, không phải sửa gì thêm
#   SILO_PORT          (9000) → MINIO_ENDPOINT và PUBLIC_S3_URL = http://localhost:<cổng>
#   SILO_CONSOLE_PORT  (9001) → chỉ để mở console trên trình duyệt
#   MAILPIT_SMTP_PORT  (1025) → SMTP_PORT (khi gửi email vào Mailpit)
#   MAILPIT_UI_PORT    (8025) → mở http://localhost:<cổng> xem email OTP
# Số bên phải dấu ":" là cổng trong container — giữ nguyên.
# Dùng PostgreSQL cài thẳng trên máy (khối CSDL [2] trong .env) → chỉ bật phần còn lại:
#   docker compose --env-file .env -f deploy/docker-compose.local.yml up -d redis silo silo-init mailpit
# Production KHÔNG dùng file này: CSDL = AWS RDS, kho tệp = AWS S3 (ADR 0010, deploy/aws/README.md).
name: genie-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: genie
      POSTGRES_USER: ${DB_USER:-genie}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-genie} -d genie"], interval: 5s }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-changeme}"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: [redisdata:/data]

  silo:
    # Kho tệp S3 — Silo (fork cộng đồng của MinIO, ADR 0009). Biến MINIO_* là tên Silo bắt buộc, giữ nguyên.
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-siloadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
    ports: ["${SILO_PORT:-9000}:9000", "${SILO_CONSOLE_PORT:-9001}:9001"]
    volumes: [silodata:/data]
    healthcheck: { test: ["CMD-SHELL", "silo healthcheck ready || mcli ready local || mc ready local"], interval: 5s }

  silo-init:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z                  # có sẵn client mcli + /bin/sh — không cần image mc riêng
    depends_on: { silo: { condition: service_healthy } }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-siloadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:-genie-app}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:-changeme}
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes: [./silo/init.sh:/init.sh:ro]

  mailpit:
    image: axllent/mailpit:v1.20
    ports: ["${MAILPIT_SMTP_PORT:-1025}:1025", "${MAILPIT_UI_PORT:-8025}:8025"]   # SMTP / giao diện xem email OTP

volumes:
  pgdata:
  redisdata:
  silodata:
