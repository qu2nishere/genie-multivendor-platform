# Máy dev: postgres, redis, silo (kho tệp S3) + silo-init, mailpit — backend / web / ai-worker chạy từ IDE (TECH_STACK mục 16.1)
# Chạy: docker compose -f deploy/docker-compose.local.yml --env-file deploy/.env up -d
name: genie-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: genie
      POSTGRES_USER: ${DB_USER:-genie}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-genie} -d genie"], interval: 5s }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-changeme}"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]

  silo:
    # Kho tệp S3 — Silo (fork cộng đồng của MinIO, ADR 0009). Biến MINIO_* là tên Silo bắt buộc, giữ nguyên.
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-siloadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
    ports: ["9000:9000", "9001:9001"]
    volumes: [silodata:/data]
    healthcheck: { test: ["CMD-SHELL", "silo healthcheck ready || mcli ready local || mc ready local"], interval: 5s }

  silo-init:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z                  # có sẵn client mcli + /bin/sh — không cần image mc riêng
    depends_on: { silo: { condition: service_healthy } }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-siloadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:-genie-app}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:-changeme}
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes: [./silo/init.sh:/init.sh:ro]

  mailpit:
    image: axllent/mailpit:v1.20
    ports: ["1025:1025", "8025:8025"]   # SMTP / giao diện xem email OTP

volumes:
  pgdata:
  redisdata:
  silodata:
